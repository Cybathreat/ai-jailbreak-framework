[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-jailbreak-framework"
version = "1.0.0"
description = "Security research framework for testing LLM safety alignment and jailbreak techniques"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ahmed Chiboub", email = "ahmed.chiboub@cybacrest.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
ai-jailbreak-framework = "cli:main"

[project.urls]
Homepage = "https://github.com/Cybathreat/ai-jailbreak-framework"
Issues = "https://github.com/Cybathreat/ai-jailbreak-framework/issues"
